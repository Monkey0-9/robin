$schema: https://compose-spec.io/schemas/docker-compose.yaml
version: '3.8'

services:
  matching_engine:
    build:
      context: ./services/execution-core
      dockerfile: Dockerfile
    ports:
      - 9091:9091
    environment:
      - ENGINE_PORT=9091
      - LATENCY_PROFILE=ultra-low
    deploy:
      resources:
        limits:
          cpus: 2.00
          memory: 2048M
    healthcheck:
      test: [CMD-SHELL, nc -z localhost 9091 || exit 1]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      - MATCHING_ENGINE_HOST=risk-analytics
      - MATCHING_ENGINE_PORT=9092
      - JWT_SECRET=${JWT_SECRET?Error: JWT_SECRET environment variable is required}
      - LIVE_FEED_ENABLED=true
    deploy:
      resources:
        limits:
          cpus: 1.00
          memory: 1024M
    healthcheck:
      test: [CMD-SHELL, wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - matching_engine
      - risk-analytics
    restart: unless-stopped

  risk-analytics:
    build:
      context: ./services/risk-analytics
      dockerfile: Dockerfile
    ports:
      - 9092:9092
      - 9096:9096
    deploy:
      resources:
        limits:
          cpus: 1.00
          memory: 1024M
    healthcheck:
      test: [CMD-SHELL, nc -z localhost 9092 || exit 1]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8080
    deploy:
      resources:
        limits:
          cpus: 1.00
          memory: 1024M
    depends_on:
      - gateway
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3001:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Error: GF_SECURITY_ADMIN_PASSWORD environment variable is required}
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: 512M
    depends_on:
      - prometheus
    restart: unless-stopped
