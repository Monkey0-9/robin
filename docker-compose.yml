$schema: https://compose-spec.io/schemas/docker-compose.yaml
version: '3.8'

services:
  matching_engine:
    build:
      context: ./services/execution-core
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LATENCY_PROFILE=ultra-low
    restart: unless-stopped

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MATCHING_ENGINE_URL=http://matching_engine:8000
      - JWT_SECRET=robin-institutional-secret
      - LIVE_FEED_ENABLED=true
    depends_on:
      - matching_engine
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8080
    depends_on:
      - gateway
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped
