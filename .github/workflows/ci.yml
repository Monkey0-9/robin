name: Robin CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly dependency & supply-chain re-scan (Phase 5.6 / 5.7)
    - cron: '0 3 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Secret Scanning
  # ============================================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # SBOM Generation (Phase 5.6)
  # SPDX + CycloneDX bills-of-materials are produced from the checked-out
  # workspace on every push/PR and the artifact is retained for audit.
  # ============================================================================
  sbom:
    name: SBOM Generation (SPDX / CycloneDX)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          artifact-name: robin-sbom-spdx
      - uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          artifact-name: robin-sbom-cyclonedx

  # ============================================================================
  # Dependency Vulnerability Scan (Phase 5.6)
  # Trivy scans the filesystem (Cargo.lock, go.sum, package-lock.json,
  # requirements.txt) for known-CVE advisories. Fails on critical/high.
  # ============================================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: '1'
          ignore-unfixed: true

  # ============================================================================
  # Penetration Testing (Phase 5.7)
  # Automated black-box security validation against a live gateway instance.
  # `scripts/security_pentest.py` performs OWASP Top-10 oriented probes and
  # fails the job on any HIGH/CRITICAL finding.
  # ============================================================================
  pentest:
    name: Automated Penetration Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build gateway binary
        run: |
          cd services/gateway
          go build -o /tmp/robin-gateway .
      - name: Launch gateway under test
        run: |
          /tmp/robin-gateway > /tmp/gateway-pentest.log 2>&1 &
          echo "ROBIN_GATEWAY_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "gateway ready"
              exit 0
            fi
            sleep 1
          done
          echo "gateway failed to become ready"
          cat /tmp/gateway-pentest.log
          exit 1
      - name: Run security pentest suite
        run: |
          python scripts/security_pentest.py --base-url http://localhost:8080
      - name: Upload pentest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-pentest-log
          path: /tmp/gateway-pentest.log

  # ============================================================================
  # Frontend: Next.js + TypeScript
  # ============================================================================
  frontend:
    name: Frontend — Next.js
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd frontend && (npm ci || npm install)
      - name: Typecheck
        run: cd frontend && npx tsc --noEmit
      - name: Lint
        run: cd frontend && npm run lint
      - name: Tests
        run: cd frontend && npm test
      - name: Build
        run: cd frontend && npm run build

  # ============================================================================
  # Rust: Risk Analytics
  # ============================================================================
  rust-risk:
    name: Rust — Risk Analytics
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (protoc & ssl)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Build
        run: cargo build --release -p robin-risk-analytics
      - name: Test
        run: cargo test --release -p robin-risk-analytics -- --nocapture
      - name: Clippy (deny warnings)
        run: cargo clippy -p robin-risk-analytics -- -D warnings

  # ============================================================================
  # Rust: Compliance
  # ============================================================================
  rust-compliance:
    name: Rust — Compliance
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (protoc & ssl)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Build (lib + daemon)
        run: cargo build --release -p robin-compliance
      - name: Test
        run: cargo test --release -p robin-compliance -- --nocapture
      - name: Clippy
        run: cargo clippy -p robin-compliance -- -D warnings

  # ============================================================================
  # Go: Gateway Orchestrator
  # ============================================================================
  go-gateway:
    name: Go — Gateway Orchestrator
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: cd services/gateway && go build ./...
      - name: Vet
        run: cd services/gateway && go vet ./...
      - name: Test
        run: cd services/gateway && go test -v -race ./...

  # ============================================================================
  # C++: Execution Core
  # ============================================================================
  cpp-execution:
    name: C++ — Execution Core
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-12 libnuma-dev
      - name: CMake configure (pin g++-12)
        run: |
          cmake -S services/execution-core \
                -B services/execution-core/build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=g++-12
      - name: Build
        run: cmake --build services/execution-core/build -j$(nproc)
      - name: CTest (if tests exist)
        run: |
          cd services/execution-core/build
          ctest --output-on-failure 2>/dev/null || echo "No CTest targets yet"

  # ============================================================================
  # C++: Execution Core Fuzzing
  # ============================================================================
  cpp-execution-fuzz:
    name: C++ — Execution Core Fuzzing
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libnuma-dev
      - name: CMake configure with clang and fuzzing flags
        run: |
          # Use clang++ for libFuzzer support
          cmake -S services/execution-core \
                -B services/execution-core/build-fuzz \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer,address -g -O1"
      - name: Build fuzzer
        run: cmake --build services/execution-core/build-fuzz --target order_book_fuzzer -j$(nproc)
      - name: Prepare corpus
        run: |
          mkdir -p services/execution-core/corpus
          # Generate a seed file for the corpus (if possible, or just an empty corpus for it to learn)
          echo -n "{\"type\":\"NEW\",\"id\":1,\"price\":100000000,\"qty\":100,\"side\":\"BID\"}" > services/execution-core/corpus/seed1.json
      - name: Run Fuzzer (1 Hour)
        run: |
          # Run for 3600 seconds = 1 hour
          services/execution-core/build-fuzz/order_book_fuzzer services/execution-core/corpus -max_total_time=3600

  # ============================================================================
  # C++: Pricing
  # ============================================================================
  cpp-pricing:
    name: C++ — Pricing
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++-12
      - name: CMake configure + build
        run: |
          cmake -S research/pricing \
                -B research/pricing/build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=g++-12
          cmake --build research/pricing/build -j$(nproc)

  # ============================================================================
  # Python: AI engine validation
  # ============================================================================
  python-validation:
    name: Python — AI Engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: Validate backtester
        run: |
          source venv/bin/activate
          python research/strategy-engine/backtester.py
      - name: Validate alternative data loader (if present)
        run: |
          if python -c "import ast; ast.parse(open('services/data-ingestion/alternative/alternative_data_loader.py').read())" 2>/dev/null; then
            echo "Syntax OK"
          else
            echo "Skipped — file not parseable"
          fi

  # ============================================================================
  # Formatting & Sanity
  # ============================================================================
  rust-fmt:
    name: Rust — Format Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  go-fmt:
    name: Go — Format Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: |
          cd services/gateway
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files need formatting:"
            gofmt -l .
            exit 1
          fi
