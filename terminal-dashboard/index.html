<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Market Monitor Terminal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="terminal-header">
        <div class="logo">TERMINAL // GLOBAL_MARKETS_MONITOR</div>
        <div class="status-bar">
            <span id="connection-status" class="online">● LIVE</span>
            <span id="current-time"></span>
        </div>
    </header>

    <main class="dashboard-grid" id="dashboard-grid">
        <!-- Global Indices -->
        <div class="widget" draggable="true" data-id="indices">
            <div class="widget-header">Global Indices <span class="drag-handle">≡</span></div>
            <div class="widget-content" id="indices-content"></div>
        </div>

        <!-- AAPL Chart -->
        <div class="widget" draggable="true" data-id="aapl-chart">
            <div class="widget-header">AAPL 60-Session Chart <span class="drag-handle">≡</span></div>
            <div class="widget-content">
                <canvas id="aaplCanvas"></canvas>
            </div>
        </div>

        <!-- Heatmap -->
        <div class="widget" draggable="true" data-id="heatmap">
            <div class="widget-header">AI / Energy / Financials Heatmap <span class="drag-handle">≡</span></div>
            <div class="widget-content">
                <div class="heatmap-grid" id="heatmap-content"></div>
            </div>
        </div>

        <!-- Precious Metals -->
        <div class="widget" draggable="true" data-id="metals">
            <div class="widget-header">Precious Metals <span class="drag-handle">≡</span></div>
            <div class="widget-content" id="metals-content"></div>
        </div>

        <!-- World Clocks -->
        <div class="widget" draggable="true" data-id="clocks">
            <div class="widget-header">World Session Clocks <span class="drag-handle">≡</span></div>
            <div class="widget-content clocks-container" id="clocks-content"></div>
        </div>

        <!-- Portfolio (Using specific colors as requested) -->
        <div class="widget portfolio-widget" draggable="true" data-id="portfolio">
            <div class="widget-header">Portfolio Holdings <span class="drag-handle">≡</span></div>
            <div class="widget-content" id="portfolio-content">
                <!-- Data will be populated via JS -->
            </div>
        </div>
    </main>

    <!-- Local Libraries -->
    <script src="lib/chart.min.js"></script>
    
    <!-- Application Logic -->
    <script src="js/data-adapters.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
