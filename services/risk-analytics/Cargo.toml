[package]
name = "robin-risk-analytics"
version = "1.0.0"
edition = "2021"
description = "Pre-trade risk gate research prototype, zero-allocation hot path"

[lib]
name = "robin_risk"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "1", default-features = false }
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3.4"
heapless = "0.8"
libm = "0.2"
coarsetime = "0.1"
tracing = "0.1"
opentelemetry = { version = "0.21", features = ["trace"] }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.14", features = ["tonic", "metrics"] }
tracing-opentelemetry = "0.22"
tracing-subscriber = "0.3"

[[bin]]
name = "robin-risk-daemon"
path = "src/main.rs"



[features]
default = []
